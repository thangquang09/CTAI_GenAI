3cSEP\u003eMirror On Site is a feature that allows users to mirror the order of items in their collection view to their live site.\u003cSEP\u003eMirror on site is a feature that allows users to mirror their collection\u0027s item order on their website.\u003cSEP\u003eMirror On Site is a feature that allows users to mirror the item order of a collection on their live site.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\u003cSEP\u003echunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "FAQs", "label": "FAQs", "shape": "dot", "size": 20, "title": "entity_id: FAQs\nentity_type: content\ndescription: FAQs, or Frequently Asked Questions, are a type of content that provides answers to common questions about a topic or system.\u003cSEP\u003eFAQs refer to a section of frequently asked questions that provide answers to common queries about sorting, filtering, and mirroring live site content.\u003cSEP\u003eFrequently Asked Questions provide answers to common questions about managing CMS collection content.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\u003cSEP\u003echunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Collection", "label": "Collection", "shape": "dot", "size": 20, "title": "entity_id: Collection\nentity_type: concept\ndescription: A collection is a grouping of items that can be controlled and managed.\u003cSEP\u003eA collection refers to a group of items or data that can be managed and organized within a CMS.\u003cSEP\u003eA collection is a group of items that can be managed and displayed on a site.\u003cSEP\u003eA collection consists of distinct fields and items, with each item\u0027s content stored in its fields.\u003cSEP\u003eA collection in the context of Wix\u0027s CMS refers to a group of related content items.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\u003cSEP\u003echunk-e0f039145f41fa401d0e8e33a185f71a\u003cSEP\u003echunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778651\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Item", "label": "Item", "shape": "dot", "size": 20, "title": "entity_id: Item\nentity_type: concept\ndescription: An item is an individual element or entry within a collection, which can have various fields and properties associated with it.\u003cSEP\u003eAn item is a component of a collection, consisting of multiple fields and their values.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Field Values", "label": "Field Values", "shape": "dot", "size": 20, "title": "entity_id: Field Values\nentity_type: concept\ndescription: Field values refer to the specific data or content entered into a field within a collection or item.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\nfile_path: unknown_source\ncreated_at: 1762778026\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Sort", "label": "Sort", "shape": "dot", "size": 20, "title": "entity_id: Sort\nentity_type: method\ndescription: Sort is a method or feature used to arrange items in a collection in a specific order based on certain criteria or conditions.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\nfile_path: unknown_source\ncreated_at: 1762778026\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Filter", "label": "Filter", "shape": "dot", "size": 20, "title": "entity_id: Filter\nentity_type: method\ndescription: Filter is a method or feature used to selectively display or hide items in a collection based on specific conditions or criteria.\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\nfile_path: unknown_source\ncreated_at: 1762778026\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Mirror On Site Feature", "label": "Mirror On Site Feature", "shape": "dot", "size": 20, "title": "entity_id: Mirror On Site Feature\nentity_type: method\ndescription: The Mirror on Site feature applies the order of the collection view to connected site elements.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778026\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Text Field Type", "label": "Text Field Type", "shape": "dot", "size": 20, "title": "entity_id: Text Field Type\nentity_type: concept\ndescription: A Text field type is used for sorting items in an alphabetic sequence.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778026\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Hotels", "label": "Wix Hotels", "shape": "dot", "size": 20, "title": "entity_id: Wix Hotels\nentity_type: organization\ndescription: Wix Hotels is a hotel management service that allows users to import reservations from external calendars.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "iCal", "label": "iCal", "shape": "dot", "size": 20, "title": "entity_id: iCal\nentity_type: method\ndescription: iCal is a calendar format that allows users to export and import calendar data.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Airbnb", "label": "Airbnb", "shape": "dot", "size": 20, "title": "entity_id: Airbnb\nentity_type: organization\ndescription: Airbnb is an external service that allows users to export their calendar in iCal format.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "HomeAway", "label": "HomeAway", "shape": "dot", "size": 20, "title": "entity_id: HomeAway\nentity_type: organization\ndescription: HomeAway is an external service that allows users to export their calendar in iCal format.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "VRBO", "label": "VRBO", "shape": "dot", "size": 20, "title": "entity_id: VRBO\nentity_type: organization\ndescription: VRBO is an external service that allows users to export their calendar in iCal format.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Hotels Reservation Calendar", "label": "Wix Hotels Reservation Calendar", "shape": "dot", "size": 20, "title": "entity_id: Wix Hotels Reservation Calendar\nentity_type: artifact\ndescription: The Wix Hotels reservation calendar is a tool that stays up to date after importing external calendars.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Hotels Channel Manager", "label": "Wix Hotels Channel Manager", "shape": "dot", "size": 20, "title": "entity_id: Wix Hotels Channel Manager\nentity_type: artifact\ndescription: The Wix Hotels Channel Manager is a feature that is not compatible with the calendar import feature.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "HotelRunner", "label": "HotelRunner", "shape": "dot", "size": 20, "title": "entity_id: HotelRunner\nentity_type: organization\ndescription: HotelRunner is a company that provides a new version of Wix Hotels.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778036\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Number Field Type", "label": "Number Field Type", "shape": "dot", "size": 20, "title": "entity_id: Number Field Type\nentity_type: concept\ndescription: A Number field type is used for sorting items in a numerical sequence.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Dataset", "label": "Dataset", "shape": "dot", "size": 20, "title": "entity_id: Dataset\nentity_type: concept\ndescription: A dataset is a collection of items that can be sorted and controlled.\u003cSEP\u003eA dataset is a collection of data that can be used to sort and filter items on a site.\u003cSEP\u003eA dataset is a connection between page elements and CMS collection content.\u003cSEP\u003eA dataset is a collection of data that can be used to filter and sort collection items.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\u003cSEP\u003echunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\u003cSEP\u003echunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Site Elements", "label": "Site Elements", "shape": "dot", "size": 20, "title": "entity_id: Site Elements\nentity_type: artifact\ndescription: Site elements are the components of a website that can be connected to a collection.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Live Site", "label": "Live Site", "shape": "dot", "size": 20, "title": "entity_id: Live Site\nentity_type: location\ndescription: The live site is where the collection items are displayed to the public.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Alphabetic Sorting", "label": "Alphabetic Sorting", "shape": "dot", "size": 20, "title": "entity_id: Alphabetic Sorting\nentity_type: concept\ndescription: Alphabetic sorting is a method of arranging items in a sequence based on alphabetical order.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Numerical Sorting", "label": "Numerical Sorting", "shape": "dot", "size": 20, "title": "entity_id: Numerical Sorting\nentity_type: concept\ndescription: Numerical sorting is a method of arranging items in a sequence based on numerical order.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Item Visibility", "label": "Item Visibility", "shape": "dot", "size": 20, "title": "entity_id: Item Visibility\nentity_type: concept\ndescription: Item visibility refers to the ability to control whether items are shown or hidden on a live site.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778043\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Field Type", "label": "Field Type", "shape": "dot", "size": 20, "title": "entity_id: Field Type\nentity_type: concept\ndescription: Field type refers to the classification of a field, such as Text or Number, which determines its sorting behavior.\u003cSEP\u003eField types in Wix\u0027s CMS determine the type of content that can be stored in a field, such as text, image, or date.\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Reservation", "label": "Reservation", "shape": "dot", "size": 20, "title": "entity_id: Reservation\nentity_type: concept\ndescription: A reservation is a booking or appointment made by a customer for a hotel room or other accommodation.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778052\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Room Type", "label": "Room Type", "shape": "dot", "size": 20, "title": "entity_id: Room Type\nentity_type: concept\ndescription: Room type refers to the category or classification of a hotel room, such as single, double, or suite.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778052\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Hotels Tab", "label": "Hotels Tab", "shape": "dot", "size": 20, "title": "entity_id: Hotels Tab\nentity_type: artifact\ndescription: The Hotels tab is a section or module within the dashboard that provides access to hotel management features.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778052\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Reservations Tab", "label": "Reservations Tab", "shape": "dot", "size": 20, "title": "entity_id: Reservations Tab\nentity_type: artifact\ndescription: The Reservations tab is a subsection or submodule within the Hotels tab that allows users to manage reservations.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778052\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "URL", "label": "URL", "shape": "dot", "size": 20, "title": "entity_id: URL\nentity_type: data\ndescription: A URL, or Uniform Resource Locator, is a web address used to identify and locate a specific resource or calendar.\u003cSEP\u003eA URL is a web address used to identify a website.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\u003cSEP\u003echunk-6e3ee50229a1fd0f63f44682509cdfad\nfile_path: unknown_source\ncreated_at: 1762778903\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Payment Details", "label": "Payment Details", "shape": "dot", "size": 20, "title": "entity_id: Payment Details\nentity_type: concept\ndescription: Payment details refer to the information related to a customer\u0027s payment, such as the amount, method, and date.\nsource_id: chunk-549c7e8f1379f2d0735562e2a928d8f4\nfile_path: unknown_source\ncreated_at: 1762778052\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Field", "label": "Field", "shape": "dot", "size": 20, "title": "entity_id: Field\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\ndescription: A field is associated with field values, which are the specific data or content stored in that field.\u003cSEP\u003eA field is a component of a collection item, with its own content and properties.\nentity_type: concept\nfile_path: unknown_source\ncreated_at: 1762778651\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Domain Voucher", "label": "Domain Voucher", "shape": "dot", "size": 20, "title": "entity_id: Domain Voucher\nentity_type: artifact\ndescription: The domain voucher is a promotional offer provided by Wix, enabling users to register a domain for free for one year.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Premium Site Plans", "label": "Premium Site Plans", "shape": "dot", "size": 20, "title": "entity_id: Premium Site Plans\nentity_type: concept\ndescription: Premium site plans are yearly or multi-year plans offered by Wix, which include a free domain voucher.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Studio Site Plans", "label": "Studio Site Plans", "shape": "dot", "size": 20, "title": "entity_id: Studio Site Plans\nentity_type: concept\ndescription: Studio site plans are a type of plan offered by Wix, which include a free domain voucher.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "WHOIS Domain Information Records", "label": "WHOIS Domain Information Records", "shape": "dot", "size": 20, "title": "entity_id: WHOIS Domain Information Records\nentity_type: data\ndescription: WHOIS domain information records contain publicly available information about domain registrations.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Private Registration", "label": "Private Registration", "shape": "dot", "size": 20, "title": "entity_id: Private Registration\nentity_type: concept\ndescription: Private registration is a service that protects users\u0027 personal information from being publicly available in WHOIS domain information records.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Full Privacy Protection", "label": "Full Privacy Protection", "shape": "dot", "size": 20, "title": "entity_id: Full Privacy Protection\nentity_type: concept\ndescription: Full privacy protection is a service offered by Wix, which keeps users\u0027 contact details private.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Basic Protection", "label": "Basic Protection", "shape": "dot", "size": 20, "title": "entity_id: Basic Protection\nentity_type: concept\ndescription: Basic protection is a service offered by Wix, which keeps some personal information private while allowing others to contact the user through a protected form.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778146\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Domain Extensions", "label": "Domain Extensions", "shape": "dot", "size": 20, "title": "entity_id: Domain Extensions\nentity_type: concept\ndescription: Domain extensions are the suffixes of domain names, such as .com or .org.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Billing Managers", "label": "Billing Managers", "shape": "dot", "size": 20, "title": "entity_id: Billing Managers\nentity_type: person\ndescription: Billing managers are individuals responsible for managing payments and applying domain vouchers on behalf of site owners.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Site Owners", "label": "Site Owners", "shape": "dot", "size": 20, "title": "entity_id: Site Owners\nentity_type: person\ndescription: Site owners are individuals who own and manage websites created using Wix services.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Collaborators", "label": "Collaborators", "shape": "dot", "size": 20, "title": "entity_id: Collaborators\nentity_type: person\ndescription: Collaborators are individuals who work together on a website, with some having roles such as billing managers.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Domain Registration", "label": "Domain Registration", "shape": "dot", "size": 20, "title": "entity_id: Domain Registration\nentity_type: concept\ndescription: Domain registration is the process of registering a domain name for use on the internet.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Website Creation", "label": "Website Creation", "shape": "dot", "size": 20, "title": "entity_id: Website Creation\nentity_type: concept\ndescription: Website creation is the process of designing and building a website, which can be done using Wix services.\nsource_id: chunk-9eb2916332bbcbddbdea2dea8c35ce03\nfile_path: unknown_source\ncreated_at: 1762778157\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Payment Provider", "label": "Payment Provider", "shape": "dot", "size": 20, "title": "entity_id: Payment Provider\nentity_type: organization\ndescription: Payment providers are third-party services that manage payouts and have minimum payment thresholds.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778178\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Business \u0026 eCommerce Premium Plan", "label": "Business \u0026 eCommerce Premium Plan", "shape": "dot", "size": 20, "title": "entity_id: Business \u0026 eCommerce Premium Plan\nentity_type: concept\ndescription: The Business \u0026 eCommerce Premium plan is a required subscription for Wix sites to accept payments.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778178\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Pricing Plans", "label": "Pricing Plans", "shape": "dot", "size": 20, "title": "entity_id: Pricing Plans\nentity_type: concept\ndescription: Pricing Plans are structures for pricing products or services, which must be above the minimum payment threshold.\u003cSEP\u003ePricing plans are used to receive recurring payments for services that renew using PayPal.\u003cSEP\u003ePricing Plans refer to the different plans offered to clients, which can be discounted using coupons.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\u003cSEP\u003echunk-b547442ea82aacb3fc7acd39a219545d\u003cSEP\u003echunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Minimum Payment Threshold", "label": "Minimum Payment Threshold", "shape": "dot", "size": 20, "title": "entity_id: Minimum Payment Threshold\nentity_type: concept\ndescription: The minimum payment threshold is the lowest amount that payment providers will process.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778178\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Recurring Payments", "label": "Recurring Payments", "shape": "dot", "size": 20, "title": "entity_id: Recurring Payments\nentity_type: concept\ndescription: Recurring payments are a type of payment that can be offered through supported payment providers.\u003cSEP\u003eRecurring Payments are the ongoing payments made by clients for pricing plans, which can be discounted using coupons.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\u003cSEP\u003echunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778486\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Customers", "label": "Customers", "shape": "dot", "size": 20, "title": "entity_id: Customers\nentity_type: person\ndescription: Customers are individuals who make payments through a Wix site.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778178\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Products", "label": "Products", "shape": "dot", "size": 20, "title": "entity_id: Products\nentity_type: artifact\ndescription: Products are items or services offered by a Wix site that must be priced above the minimum payment threshold.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Services", "label": "Services", "shape": "dot", "size": 20, "title": "entity_id: Services\nentity_type: concept\ndescription: Services are offerings by a Wix site that must be priced above the minimum payment threshold.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Troubleshooting", "label": "Troubleshooting", "shape": "dot", "size": 20, "title": "entity_id: Troubleshooting\nentity_type: method\ndescription: Troubleshooting is a process used to fix issues with payment failures or connection problems.\nsource_id: chunk-b261bd1be516879bb4cf4c614f85d257\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Russia", "label": "Russia", "shape": "dot", "size": 20, "title": "entity_id: Russia\nentity_type: location\ndescription: Russia is a country where Wix no longer supports PayPal payments for businesses.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Venmo", "label": "Venmo", "shape": "dot", "size": 20, "title": "entity_id: Venmo\nentity_type: organization\ndescription: Venmo is a mobile payment app operated by PayPal, available to select US users.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "PayPal Business Account", "label": "PayPal Business Account", "shape": "dot", "size": 20, "title": "entity_id: PayPal Business Account\nentity_type: concept\ndescription: A PayPal business account is required to accept payments through PayPal on Wix.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Video", "label": "Wix Video", "shape": "dot", "size": 20, "title": "entity_id: Wix Video\nentity_type: content\ndescription: Wix Video is a service that allows users to receive recurring payments for video subscriptions.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778216\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "US", "label": "US", "shape": "dot", "size": 20, "title": "entity_id: US\nentity_type: location\ndescription: The US is a country where Venmo is available to select users.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "India", "label": "India", "shape": "dot", "size": 20, "title": "entity_id: India\nentity_type: location\ndescription: India is a country where PayPal no longer offers domestic payment services.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "April 2021", "label": "April 2021", "shape": "dot", "size": 20, "title": "entity_id: April 2021\nentity_type: event\ndescription: April 2021 is the time when PayPal stopped offering domestic payment services in India.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "CAD", "label": "CAD", "shape": "dot", "size": 20, "title": "entity_id: CAD\nentity_type: data\ndescription: CAD is a currency code for Canadian Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "EUR", "label": "EUR", "shape": "dot", "size": 20, "title": "entity_id: EUR\nentity_type: data\ndescription: EUR is a currency code for Euro, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "GBP", "label": "GBP", "shape": "dot", "size": 20, "title": "entity_id: GBP\nentity_type: data\ndescription: GBP is a currency code for British Pound, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "JPY", "label": "JPY", "shape": "dot", "size": 20, "title": "entity_id: JPY\nentity_type: data\ndescription: JPY is a currency code for Japanese Yen, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "AUD", "label": "AUD", "shape": "dot", "size": 20, "title": "entity_id: AUD\nentity_type: data\ndescription: AUD is a currency code for Australian Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778226\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "NZD", "label": "NZD", "shape": "dot", "size": 20, "title": "entity_id: NZD\nentity_type: data\ndescription: NZD is a currency code for New Zealand Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778233\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "CHF", "label": "CHF", "shape": "dot", "size": 20, "title": "entity_id: CHF\nentity_type: data\ndescription: CHF is a currency code for Swiss Franc, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778233\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "HKD", "label": "HKD", "shape": "dot", "size": 20, "title": "entity_id: HKD\nentity_type: data\ndescription: HKD is a currency code for Hong Kong Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778233\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "SGD", "label": "SGD", "shape": "dot", "size": 20, "title": "entity_id: SGD\nentity_type: data\ndescription: SGD is a currency code for Singapore Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778233\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "SEK", "label": "SEK", "shape": "dot", "size": 20, "title": "entity_id: SEK\nentity_type: data\ndescription: SEK is a currency code for Swedish Krona, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778233\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "DKK", "label": "DKK", "shape": "dot", "size": 20, "title": "entity_id: DKK\nentity_type: data\ndescription: DKK is a currency code for Danish Krone, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unkn y_id: MXN\nentity_type: data\ndescription: MXN is a currency code for Mexican Peso, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778242\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "BRL", "label": "BRL", "shape": "dot", "size": 20, "title": "entity_id: BRL\nentity_type: data\ndescription: BRL is a currency code for Brazilian Real, one of the accepted currencies by PayPal, available only for Brazil.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778242\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "MYR", "label": "MYR", "shape": "dot", "size": 20, "title": "entity_id: MYR\nentity_type: data\ndescription: MYR is a currency code for Malaysian Ringgit, one of the accepted currencies by PayPal, available only for Malaysia.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778242\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "PHP", "label": "PHP", "shape": "dot", "size": 20, "title": "entity_id: PHP\nentity_type: data\ndescription: PHP is a currency code for Philippine Peso, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778242\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "TWD", "label": "TWD", "shape": "dot", "size": 20, "title": "entity_id: TWD\nentity_type: data\ndescription: TWD is a currency code for Taiwanese Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778242\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "THB", "label": "THB", "shape": "dot", "size": 20, "title": "entity_id: THB\nentity_type: data\ndescription: THB is a currency code for Thai Baht, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778279\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "USD", "label": "USD", "shape": "dot", "size": 20, "title": "entity_id: USD\nentity_type: data\ndescription: USD is a currency code for United States Dollar, one of the accepted currencies by PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778279\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "PayPal Checkout", "label": "PayPal Checkout", "shape": "dot", "size": 20, "title": "entity_id: PayPal Checkout\nentity_type: concept\ndescription: PayPal Checkout is a payment method available through PayPal.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778279\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Pay Later", "label": "Pay Later", "shape": "dot", "size": 20, "title": "entity_id: Pay Later\nentity_type: concept\ndescription: Pay Later is a payment method available through PayPal, offering multiple, interest-free payments.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778279\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "PayPal Credit", "label": "PayPal Credit", "shape": "dot", "size": 20, "title": "entity_id: PayPal Credit\nentity_type: concept\ndescription: PayPal Credit is a payment method available through PayPal, offering special financing options.\nsource_id: chunk-b547442ea82aacb3fc7acd39a219545d\nfile_path: unknown_source\ncreated_at: 1762778279\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Bookings", "label": "Wix Bookings", "shape": "dot", "size": 20, "title": "entity_id: Wix Bookings\nentity_type: artifact\ndescription: Wix Bookings is an easy-to-use scheduling system for booking and paying for services online.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix App Market", "label": "Wix App Market", "shape": "dot", "size": 20, "title": "entity_id: Wix App Market\nentity_type: location\ndescription: The Wix App Market is where users can find and add Wix Bookings to their site.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Site Editor", "label": "Site Editor", "shape": "dot", "size": 20, "title": "entity_id: Site Editor\nentity_type: artifact\ndescription: The site editor is a tool used to manage and customize a website, including setting up Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Payment Methods", "label": "Payment Methods", "shape": "dot", "size": 20, "title": "entity_id: Payment Methods\nentity_type: concept\ndescription: Payment methods refer to the various options available for clients to pay for services, such as credit card, PayPal, or in-person payments.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Membership Plans", "label": "Membership Plans", "shape": "dot", "size": 20, "title": "entity_id: Membership Plans\nentity_type: concept\ndescription: Membership plans are a feature of Wix Bookings that allow businesses to offer packages and plans to their clients.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Booking Services", "label": "Booking Services", "shape": "dot", "size": 20, "title": "entity_id: Booking Services\nentity_type: concept\ndescription: Booking services refer to the various services that can be booked through Wix Bookings, such as workshops, courses, or private sessions.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Booking Calendar", "label": "Booking Calendar", "shape": "dot", "size": 20, "title": "entity_id: Booking Calendar\nentity_type: artifact\ndescription: The booking calendar is a tool used to manage and schedule appointments, classes, and courses.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778312\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Booking Form", "label": "Booking Form", "shape": "dot", "size": 20, "title": "entity_id: Booking Form\nentity_type: artifact\ndescription: The booking form is a customizable form used to collect information from clients before they attend a session.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Reminder Emails", "label": "Reminder Emails", "shape": "dot", "size": 20, "title": "entity_id: Reminder Emails\nentity_type: concept\ndescription: Reminder emails are automated emails sent to clients to remind them of upcoming services.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "SMS Reminders", "label": "SMS Reminders", "shape": "dot", "size": 20, "title": "entity_id: SMS Reminders\nentity_type: concept\ndescription: SMS reminders are a feature that can be enabled to send reminders to clients.\u003cSEP\u003eSMS reminders are automated text messages sent to clients to remind them of upcoming services.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\u003cSEP\u003echunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Contacts Tab", "label": "Contacts Tab", "shape": "dot", "size": 20, "title": "entity_id: Contacts Tab\nentity_type: location\ndescription: The Contacts tab is a feature in the site dashboard used to view and manage client information.\u003cSEP\u003eThe contacts tab is a section in the site dashboard where users can view and manage client information.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\u003cSEP\u003echunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Workshops", "label": "Workshops", "shape": "dot", "size": 20, "title": "entity_id: Workshops\nentity_type: concept\ndescription: Workshops are a type of service that can be booked through Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Courses", "label": "Courses", "shape": "dot", "size": 20, "title": "entity_id: Courses\nentity_type: concept\ndescription: Courses are a type of service that can be booked through Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Private Sessions", "label": "Private Sessions", "shape": "dot", "size": 20, "title": "entity_id: Private Sessions\nentity_type: concept\ndescription: Private sessions are a type of service that can be booked through Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Credit Card", "label": "Credit Card", "shape": "dot", "size": 20, "title": "entity_id: Credit Card\nentity_type: concept\ndescription: Credit card is a payment method available in Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778326\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "In-Person Payments", "label": "In-Person Payments", "shape": "dot", "size": 20, "title": "entity_id: In-Person Payments\nentity_type: concept\ndescription: In-person payments are a payment method available in Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Booking Settings", "label": "Booking Settings", "shape": "dot", "size": 20, "title": "entity_id: Booking Settings\nentity_type: location\ndescription: Booking settings is a section in the site dashboard where users can configure Wix Bookings.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Emails \u0026 SMS Reminders", "label": "Emails \u0026 SMS Reminders", "shape": "dot", "size": 20, "title": "entity_id: Emails \u0026 SMS Reminders\nentity_type: concept\ndescription: Emails \u0026 SMS reminders are a feature in Wix Bookings for sending automated reminders.\nsource_id: chunk-11fcbe4f87372db8aaaa4dc2b55ebe20\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Site Dashboard", "label": "Site Dashboard", "shape": "dot", "size": 20, "title": "entity_id: Site Dashboard\nentity_type: artifact\ndescription: The site dashboard is a platform where users can manage their site\u0027s settings and client data.\nsource_id: chunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Bookings Tab", "label": "Bookings Tab", "shape": "dot", "size": 20, "title": "entity_id: Bookings Tab\nentity_type: artifact\ndescription: The Bookings tab is a section within the Contacts tab where users can view and update clients\u0027 past bookings.\nsource_id: chunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Clients", "label": "Clients", "shape": "dot", "size": 20, "title": "entity_id: Clients\nentity_type: person\ndescription: Clients are individuals whose past bookings and payment information can be viewed and updated in the site dashboard.\u003cSEP\u003eClients are the individuals or organizations that purchase pricing plans and can redeem discount coupons.\nsource_id: chunk-49b02fc094271eb68d2f073c52deaf22\u003cSEP\u003echunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Payment Information", "label": "Payment Information", "shape": "dot", "size": 20, "title": "entity_id: Payment Information\nentity_type: data\ndescription: Payment information is data related to clients\u0027 past bookings, including payment status and history.\nsource_id: chunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778337\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Attendance Information", "label": "Attendance Information", "shape": "dot", "size": 20, "title": "entity_id: Attendance Information\nentity_type: data\ndescription: Attendance information is data related to clients\u0027 past bookings, including attendance records and status.\nsource_id: chunk-49b02fc094271eb68d2f073c52deaf22\nfile_path: unknown_source\ncreated_at: 1762778345\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Sort Condition", "label": "Sort Condition", "shape": "dot", "size": 20, "title": "entity_id: Sort Condition\nentity_type: concept\ndescription: A sort condition is a rule that determines the order in which items are displayed in a collection or dataset.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778429\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix App Collections", "label": "Wix App Collections", "shape": "dot", "size": 20, "title": "entity_id: Wix App Collections\nentity_type: concept\ndescription: Wix app collections are a type of collection that can be used to manage and display items on a Wix site.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778447\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Blocks Collections", "label": "Wix Blocks Collections", "shape": "dot", "size": 20, "title": "entity_id: Wix Blocks Collections\nentity_type: concept\ndescription: Wix blocks collections are a type of collection that cannot be used with the Mirror On Site feature.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778447\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "CSV File", "label": "CSV File", "shape": "dot", "size": 20, "title": "entity_id: CSV File\nentity_type: artifact\ndescription: A CSV file is a type of file that can be imported into a collection to add new items.\u003cSEP\u003eA CSV (Comma Separated Values) file is a type of file used for importing and exporting data.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Reorder Icon", "label": "Reorder Icon", "shape": "dot", "size": 20, "title": "entity_id: Reorder Icon\nentity_type: artifact\ndescription: The Reorder Icon is a graphical element used to manually reorder items in a collection.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778447\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Edit Icon", "label": "Edit Icon", "shape": "dot", "size": 20, "title": "entity_id: Edit Icon\nentity_type: artifact\ndescription: The Edit Icon is a graphical element used to modify existing sort conditions in a collection.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778447\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Table Layout", "label": "Table Layout", "shape": "dot", "size": 20, "title": "entity_id: Table Layout\nentity_type: method\ndescription: Table Layout is a way to display items in a collection, allowing for manual reordering.\u003cSEP\u003eThe table layout is a way to view and manage collection content, with items as rows and fields as columns.\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778651\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Discount Coupons", "label": "Discount Coupons", "shape": "dot", "size": 20, "title": "entity_id: Discount Coupons\nentity_type: concept\ndescription: Discount Coupons are a marketing tool used to offer price or percentage discounts to clients on pricing plans.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Coupon Code", "label": "Coupon Code", "shape": "dot", "size": 20, "title": "entity_id: Coupon Code\nentity_type: data\ndescription: The Coupon Code is a unique code that clients use to redeem discounts on pricing plans.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Inbox", "label": "Wix Inbox", "shape": "dot", "size": 20, "title": "entity_id: Wix Inbox\nentity_type: artifact\ndescription: Wix Inbox is a messaging system where users can send coupons directly to clients.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Marketing \u0026 SEO", "label": "Marketing \u0026 SEO", "shape": "dot", "size": 20, "title": "entity_id: Marketing \u0026 SEO\nentity_type: concept\ndescription: Marketing \u0026 SEO refers to the section of the dashboard where users can manage marketing campaigns, including email campaigns with coupon codes.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Email Campaign", "label": "Email Campaign", "shape": "dot", "size": 20, "title": "entity_id: Email Campaign\nentity_type: method\ndescription: Email Campaigns are a way to send targeted messages, including coupon codes, to clients or potential clients.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778473\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Setup Fees", "label": "Setup Fees", "shape": "dot", "size": 20, "title": "entity_id: Setup Fees\nentity_type: concept\ndescription: Setup Fees are additional costs that may be associated with pricing plans, but are not covered by discount coupons.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778486\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Billing Cycle", "label": "Billing Cycle", "shape": "dot", "size": 20, "title": "entity_id: Billing Cycle\nentity_type: concept\ndescription: Billing Cycle refers to the recurring payment schedule for pricing plans, which can be affected by discount coupons.\nsource_id: chunk-2f4c58a4c44dfbde08427cbc1914a45d\nfile_path: unknown_source\ncreated_at: 1762778486\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Account", "label": "Wix Account", "shape": "dot", "size": 20, "title": "entity_id: Wix Account\nentity_type: artifact\ndescription: A Wix account is a user\u0027s profile and settings on the Wix platform.\u003cSEP\u003eA Wix account is a user\u0027s account on the Wix platform, which can be recovered if access is lost.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\u003cSEP\u003echunk-6e3ee50229a1fd0f63f44682509cdfad\nfile_path: unknown_source\ncreated_at: 1762778885\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Email Address", "label": "Email Address", "shape": "dot", "size": 20, "title": "entity_id: Email Address\nentity_type: data\ndescription: An email address is a unique identifier used for communication and account verification.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778616\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Account Settings", "label": "Account Settings", "shape": "dot", "size": 20, "title": "entity_id: Account Settings\nentity_type: content\ndescription: Account settings is a section on the Wix platform where users can manage their account information.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778616\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Account Recovery", "label": "Wix Account Recovery", "shape": "dot", "size": 20, "title": "entity_id: Wix Account Recovery\nentity_type: method\ndescription: Wix account recovery is a process used to regain access to a lost or forgotten account.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778616\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Password", "label": "Password", "shape": "dot", "size": 20, "title": "entity_id: Password\nentity_type: data\ndescription: A password is a secret code used to secure an account.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778616\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Recovery Phone Number", "label": "Recovery Phone Number", "shape": "dot", "size": 20, "title": "entity_id: Recovery Phone Number\nentity_type: data\ndescription: A recovery phone number is a phone number used to recover a lost or forgotten account.\u003cSEP\u003eA recovery phone number is a phone number associated with a Wix account, used for account recovery.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\u003cSEP\u003echunk-6e3ee50229a1fd0f63f44682509cdfad\nfile_path: unknown_source\ncreated_at: 1762778885\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Website", "label": "Website", "shape": "dot", "size": 20, "title": "entity_id: Website\nentity_type: artifact\ndescription: A website is a collection of online content and services created using the Wix platform.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778623\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Platform", "label": "Wix Platform", "shape": "dot", "size": 20, "title": "entity_id: Wix Platform\nentity_type: artifact\ndescription: The Wix platform is a software system that enables users to create and manage websites.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778623\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Social Login", "label": "Social Login", "shape": "dot", "size": 20, "title": "entity_id: Social Login\nentity_type: method\ndescription: Social login is a method of authentication that allows users to access the Wix platform using their social media accounts.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778623\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Password Reset", "label": "Password Reset", "shape": "dot", "size": 20, "title": "entity_id: Password Reset\nentity_type: method\ndescription: Password reset is a method used to recover a forgotten password on the Wix platform.\nsource_id: chunk-4f913ed06c16cdc1c835dc4e177c1fee\nfile_path: unknown_source\ncreated_at: 1762778623\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "List Layout", "label": "List Layout", "shape": "dot", "size": 20, "title": "entity_id: List Layout\nentity_type: method\ndescription: The list layout is a way to view collection items in a list, where users can click to open individual items to edit their field values.\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778651\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Gallery Layout", "label": "Gallery Layout", "shape": "dot", "size": 20, "title": "entity_id: Gallery Layout\nentity_type: method\ndescription: The gallery layout is a way to view items in a gallery, where users can click to open individual items to edit their field values.\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778651\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "CSV", "label": "CSV", "shape": "dot", "size": 20, "title": "entity_id: CSV\nentity_type: format\ndescription: CSV stands for Comma Separated Values, a file format used for importing and exporting collection data.\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Repeater", "label": "Repeater", "shape": "dot", "size": 20, "title": "entity_id: Repeater\nentity_type: component\ndescription: A repeater is a component that can be connected to a collection, displaying its items in a specific layout.\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Pro Galleries", "label": "Pro Galleries", "shape": "dot", "size": 20, "title": "entity_id: Pro Galleries\nentity_type: component\ndescription: Pro Galleries is a feature that can be used to display collection items in a gallery layout.\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778671\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Permissions \u0026 Privacy", "label": "Permissions \u0026 Privacy", "shape": "dot", "size": 20, "title": "entity_id: Permissions \u0026 Privacy\nentity_type: concept\ndescription: Permissions and privacy refer to the settings that control who can access, edit, or delete content in a collection.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Indexes", "label": "Indexes", "shape": "dot", "size": 20, "title": "entity_id: Indexes\nentity_type: concept\ndescription: Indexes in the context of Wix\u0027s CMS are used to speed up collection queries and prevent duplicates.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Dynamic Page", "label": "Dynamic Page", "shape": "dot", "size": 20, "title": "entity_id: Dynamic Page\nentity_type: concept\ndescription: A dynamic page is a type of page that can be created to showcase collection content.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix Multilingual", "label": "Wix Multilingual", "shape": "dot", "size": 20, "title": "entity_id: Wix Multilingual\nentity_type: artifact\ndescription: Wix Multilingual is a tool that allows users to translate their collection content.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Wix App", "label": "Wix App", "shape": "dot", "size": 20, "title": "entity_id: Wix App\nentity_type: artifact\ndescription: The Wix app is a mobile application that allows users to manage their collection content on the go.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778695\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Text Field", "label": "Text Field", "shape": "dot", "size": 20, "title": "entity_id: Text Field\nentity_type: concept\ndescription: A text field is a type of field that stores plain text.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Image Field", "label": "Image Field", "shape": "dot", "size": 20, "title": "entity_id: Image Field\nentity_type: concept\ndescription: An image field is a type of field that stores image files.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Media Gallery", "label": "Media Gallery", "shape": "dot", "size": 20, "title": "entity_id: Media Gallery\nentity_type: concept\ndescription: A media gallery is a type of field that stores multiple images or videos.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Boolean Field", "label": "Boolean Field", "shape": "dot", "size": 20, "title": "entity_id: Boolean Field\nentity_type: concept\ndescription: A boolean field is a type of field that stores binary true or false values.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Number Field", "label": "Number Field", "shape": "dot", "size": 20, "title": "entity_id: Number Field\nentity_type: concept\ndescription: A number field is a type of field that stores numerical data.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Date Field", "label": "Date Field", "shape": "dot", "size": 20, "title": "entity_id: Date Field\nentity_type: concept\ndescription: A date field is a type of field that stores date and optional time values.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Time Field", "label": "Time Field", "shape": "dot", "size": 20, "title": "entity_id: Time Field\nentity_type: concept\ndescription: A time field is a type of field that stores time information.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Rich Content Field", "label": "Rich Content Field", "shape": "dot", "size": 20, "title": "entity_id: Rich Content Field\nentity_type: concept\ndescription: A rich content field is a type of field that allows for rich text formatting and media embeds.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778709\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Reference Field", "label": "Reference Field", "shape": "dot", "size": 20, "title": "entity_id: Reference Field\nentity_type: concept\ndescription: A reference field is a type of field that creates a relationship between content items.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Multi-Reference Field", "label": "Multi-Reference Field", "shape": "dot", "size": 20, "title": "entity_id: Multi-Reference Field\nentity_type: concept\ndescription: A multi-reference field is a type of field that creates multiple relationships between content items.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "URL Field", "label": "URL Field", "shape": "dot", "size": 20, "title": "entity_id: URL Field\nentity_type: concept\ndescription: A URL field is a type of collection field used to store website addresses or email links.\u003cSEP\u003eA URL field is a type of field that stores web addresses.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\u003cSEP\u003echunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Document Field", "label": "Document Field", "shape": "dot", "size": 20, "title": "entity_id: Document Field\nentity_type: concept\ndescription: A document field is a type of field that stores single document files.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Multi-Document Field", "label": "Multi-Document Field", "shape": "dot", "size": 20, "title": "entity_id: Multi-Document Field\nentity_type: concept\ndescription: A multi-document field is a type of field that stores multiple document files.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Video Field", "label": "Video Field", "shape": "dot", "size": 20, "title": "entity_id: Video Field\nentity_type: concept\ndescription: A video field is a type of field that stores single video files.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Audio Field", "label": "Audio Field", "shape": "dot", "size": 20, "title": "entity_id: Audio Field\nentity_type: concept\ndescription: An audio field is a type of field that stores single audio files.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Address Field", "label": "Address Field", "shape": "dot", "size": 20, "title": "entity_id: Address Field\nentity_type: concept\ndescription: An address field is a type of field that stores structured data for physical addresses.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778717\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Tags Field", "label": "Tags Field", "shape": "dot", "size": 20, "title": "entity_id: Tags Field\nentity_type: concept\ndescription: A tags field is a type of field that manages and categorizes content items using keywords or descriptive labels.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Array Field", "label": "Array Field", "shape": "dot", "size": 20, "title": "entity_id: Array Field\nentity_type: concept\ndescription: An array field is a type of field that inputs and manages multiple values within a single field.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Object Field", "label": "Object Field", "shape": "dot", "size": 20, "title": "entity_id: Object Field\nentity_type: concept\ndescription: An object field is a type of field that manages complex and structured data using custom objects or data structures.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Field Validations", "label": "Field Validations", "shape": "dot", "size": 20, "title": "entity_id: Field Validations\nentity_type: concept\ndescription: Field validations are settings that control the type of content that can be stored in a field, such as required fields, character limits, and specific values.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Default Field Values", "label": "Default Field Values", "shape": "dot", "size": 20, "title": "entity_id: Default Field Values\nentity_type: concept\ndescription: Default field values are pre-set values that populate automatically when new items are added to a collection.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Input Elements", "label": "Input Elements", "shape": "dot", "size": 20, "title": "entity_id: Input Elements\nentity_type: concept\ndescription: Input elements are features that allow users to add new items to a collection.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Site Collaborators", "label": "Site Collaborators", "shape": "dot", "size": 20, "title": "entity_id: Site Collaborators\nentity_type: concept\ndescription: Site collaborators are users who have permission to access and edit a website\u0027s content.\nsource_id: chunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "CMS Collections", "label": "CMS Collections", "shape": "dot", "size": 20, "title": "entity_id: CMS Collections\nentity_type: concept\ndescription: CMS Collections refer to the organized sets of data and content within the Wix platform.\nsource_id: chunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778738\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Dynamic Pages", "label": "Dynamic Pages", "shape": "dot", "size": 20, "title": "entity_id: Dynamic Pages\nentity_type: concept\ndescription: Dynamic pages are web pages that display content from CMS collections.\nsource_id: chunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778748\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Static Pages", "label": "Static Pages", "shape": "dot", "size": 20, "title": "entity_id: Static Pages\nentity_type: concept\ndescription: Static pages are web pages that do not display dynamic content from CMS collections.\nsource_id: chunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778748\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Collection Fields", "label": "Collection Fields", "shape": "dot", "size": 20, "title": "entity_id: Collection Fields\nentity_type: concept\ndescription: Collection fields are the individual elements of data within a CMS collection.\nsource_id: chunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778748\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "URL Slug", "label": "URL Slug", "shape": "dot", "size": 20, "title": "entity_id: URL Slug\nentity_type: concept\ndescription: A URL slug is a part of a URL that identifies a specific page.\nsource_id: chunk-bb89443093a62ed04b233cc893d59471\nfile_path: unknown_source\ncreated_at: 1762778748\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Email Client", "label": "Email Client", "shape": "dot", "size": 20, "title": "entity_id: Email Client\nentity_type: artifact\ndescription: An email client is a software \nfile_path: unknown_source\ncreated_at: 1762778087\ntruncate: ", "to": "Filter", "width": 2}, {"color": "#FFFFFF", "from": "CMS", "title": "weight: 2.0\ndescription: The CMS is used to manage and organize collection content.\u003cSEP\u003eThe CMS has a feature called collection.\nkeywords: content organization,feature,platform,system management\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778757\ntruncate: ", "to": "Collection", "width": 2}, {"color": "#FFFFFF", "from": "Collection View", "title": "weight: 1.0\ndescription: A collection view is composed of fields, which can be customized and organized to meet specific needs.\nkeywords: customization,organization\nsource_id: chunk-a35c395eb2de6194b0d0b819cc25645d\nfile_path: unknown_source\ncreated_at: 1762778067\ntruncate: ", "to": "Fields", "width": 2}, {"color": "#FFFFFF", "from": "Collection View", "title": "weight: 1.0\ndescription: The Mirror on Site feature is used in the collection view to apply ordering to site elements.\nkeywords: feature application,ordering\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\nfile_path: unknown_source\ncreated_at: 1762778073\ntruncate: ", "to": "Mirror On Site Feature", "width": 2}, {"color": "#FFFFFF", "from": "Collection View", "title": "weight: 2.0\ndescription: The collection view is used to manage and control the collection.\u003cSEP\u003eThe collection view is used to manage collections.\nkeywords: control,feature,management\nsource_id: chunk-e0f039145f41fa401d0e8e33a185f71a\u003cSEP\u003echunk-134de6c869a1bdf0a400dfea307efdce\nfile_path: unknown_source\ncreated_at: 1762778777\ntruncate: ", "to": "Collection", "width": 2}, {"color": "#FFFFFF", "from": "Collection View", "title": "weight: 1.0\ndescription: The collection view allows for control over item visibility, including showing or hiding items.\nkeywords: control,management\nsource_id: chunk-e0f039145f41fa401d et.\u003cSEP\u003eA collection can be connected to a dataset, allowing for filtering and sorting of its items.\nkeywords: data,data connection,filtering,management\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\u003cSEP\u003echunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778766\ntruncate: ", "to": "Dataset", "width": 2}, {"color": "#FFFFFF", "from": "Collection", "title": "weight: 1.0\ndescription: A CSV file can be imported into a collection to add new items.\nkeywords: data,import\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778465\ntruncate: ", "to": "CSV File", "width": 2}, {"color": "#FFFFFF", "from": "Collection", "title": "weight: 1.0\ndescription: The Collection can be displayed in a Table Layout to facilitate manual reordering.\nkeywords: display,organization\nsource_id: chunk-b4d8052bab145fa732f5fa1156e51a44\nfile_path: unknown_source\ncreated_at: 1762778471\ntruncate: ", "to": "Table Layout", "width": 2}, {"color": "#FFFFFF", "from": "Collection", "title": "weight: 1.0\ndescription: A collection is made up of multiple fields, and fields are used to organize and manage collection content.\nkeywords: content organization,field management\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778763\ntruncate: ", "to": "Field", "width": 2}, {"color": "#FFFFFF", "from": "Collection", "title": "weight: 1.0\ndescription: A repeater can be connected to a collection, displaying its items in a specific layout.\nkeywords: component integration,data display\nsource_id: chunk-a0953e715dad6f364462f8aebf53207a\nfile_path: unknown_source\ncreated_at: 1762778772\ntruncate: ", "to": "Repeater", "width": 2}, {"color": "#FFFFFF", "from": "Collection", "title": "weight: 1.0\ndescription: Pro Galleries can be used to display collection items in a gallery layout.\nkeywords: component integration,data display\nsource_id: chunk-a0953e715dad6f364462f8a         "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
