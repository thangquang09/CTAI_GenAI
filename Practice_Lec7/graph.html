passing Minneapolis and Saint Paul.\nsource_id: chunk-6e30a9ded2dae16da789664c5cc98b6a\nfile_path: unknown_source\ncreated_at: 1762759984\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Hoa K\u1ef3", "label": "Hoa K\u1ef3", "shape": "dot", "size": 20, "title": "entity_id: Hoa K\u1ef3\nentity_type: organization\ndescription: Hoa K\u1ef3 refers to the United States of America, mentioned as the country where the Twin Cities metropolitan area is located.\u003cSEP\u003eHoa K\u1ef3 is the country where the S\u00f4ng Mississippi flows.\u003cSEP\u003eHoa K\u1ef3 is the United States of America, a country that purchased a large territory through the Louisiana Purchase.\nsource_id: chunk-6e30a9ded2dae16da789664c5cc98b6a\u003cSEP\u003echunk-1ab11114eb647650006113e1a75a6795\u003cSEP\u003echunk-b6ad3388ea1674e0141b9f69b2ecce83\nfile_path: unknown_source\ncreated_at: 1762760713\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Th\u1ee7 ph\u1ee7", "label": "Th\u1ee7 ph\u1ee7", "shape": "dot", "size": 20, "title": "entity_id: Th\u1ee7 ph\u1ee7\nentity_type: concept\ndescription: Th\u1ee7 ph\u1ee7 refers to the capital city, in this context, Saint Paul being the capital of the state.\nsource_id: chunk-6e30a9ded2dae16da789664c5cc98b6a\nfile_path: unknown_source\ncreated_at: 1762759984\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Tongva", "label": "Tongva", "shape": "dot", "size": 20, "title": "entity_id: Tongva\nentity_type: organization\ndescription: The Tongva people are the indigenous inhabitants of the Santa Monica area, with their own language and culture.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Gaspar De Portol\u00e0", "label": "Gaspar De Portol\u00e0", "shape": "dot", "size": 20, "title": "entity_id: Gaspar De Portol\u00e0\nentity_type: person\ndescription: Gaspar de Portol\u00e0 is a historical figure who led an expedition group that camped near the present-day intersection of Barrington and Ohio Avenues.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Juan Cresp\u00ed", "label": "Juan Cresp\u00ed", "shape": "dot", "size": 20, "title": "entity_id: Juan Cresp\u00ed\nentity_type: person\ndescription: Juan Cresp\u00ed is a person who possibly named Santa Monica due to a pair of springs reminding him of Saint Monica\u0027s tears.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Saint Monica", "label": "Saint Monica", "shape": "dot", "size": 20, "title": "entity_id: Saint Monica\nentity_type: person\ndescription: Saint Monica is a historical figure whose feast day and story are connected to the naming of Santa Monica.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Saint Augustine", "label": "Saint Augustine", "shape": "dot", "size": 20, "title": "entity_id: Saint Augustine\nentity_type: person\ndescription: Saint Augustine is a historical figure and the son of Saint Monica.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Kuruvungna Springs", "label": "Kuruvungna Springs", "shape": "dot", "size": 20, "title": "entity_id: Kuruvungna Springs\nentity_type: naturalobject\ndescription: Kuruvungna Springs, also known as Serra Springs, are a pair of springs that may have inspired the naming of Santa Monica.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Barrington Avenue", "label": "Barrington Avenue", "shape": "dot", "size": 20, "title": "entity_id: Barrington Avenue\nentity_type: location\ndescription: Barrington Avenue is a street in Santa Monica where Gaspar de Portol\u00e0\u0027s expedition group camped.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760017\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Ohio Avenue", "label": "Ohio Avenue", "shape": "dot", "size": 20, "title": "entity_id: Ohio Avenue\nentity_type: location\ndescription: Ohio Avenue is a street in Santa Monica where Gaspar de Portol\u00e0\u0027s expedition group camped.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760027\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Augustine", "label": "Augustine", "shape": "dot", "size": 20, "title": "entity_id: Augustine\nentity_type: person\ndescription: Augustine is a historical figure and the son of Saint Monica.\nsource_id: chunk-adc3204c0fc39c11f59547bd2e76c414\nfile_path: unknown_source\ncreated_at: 1762760027\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Molotov-Ribbentrop Pact", "label": "Molotov-Ribbentrop Pact", "shape": "dot", "size": 20, "title": "entity_id: Molotov-Ribbentrop Pact\nentity_type: event\ndescription: The Molotov-Ribbentrop Pact was a significant political agreement discussed in the context of European security and potential German aggression.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Li\u00ean X\u00f4", "label": "Li\u00ean X\u00f4", "shape": "dot", "size": 20, "title": "entity_id: Li\u00ean X\u00f4\nentity_type: organization\ndescription: Li\u00ean X\u00f4, or the Soviet Union, was a key participant in the discussions, proposing definitions of indirect attack and seeking guarantees for Eastern European countries.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Anh", "label": "Anh", "shape": "dot", "size": 20, "title": "entity_id: Anh\nentity_type: location\ndescription: Anh, or the United Kingdom, was involved in the negotiations, expressing concerns over the Soviet Union\u0027s proposed language and its potential implications for Finland and the Baltic states.\u003cSEP\u003eAnh l\u00e0 qu\u1ed1c gia n\u01a1i di\u1ec5n ra cu\u1ed9c chinh ph\u1ee5c Norman.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\u003cSEP\u003echunk-af42d1124f930ea854e148b3ba24336e\nfile_path: unknown_source\ncreated_at: 1762760365\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "\u0110\u1ee9c", "label": "\u0110\u1ee9c", "shape": "dot", "size": 20, "title": "entity_id: \u0110\u1ee9c\nentity_type: organization\ndescription: \u0110\u1ee9c, or Germany, was a central concern in the discussions due to its potential for aggression in Europe.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Ph\u1ea7n Lan", "label": "Ph\u1ea7n Lan", "shape": "dot", "size": 20, "title": "entity_id: Ph\u1ea7n Lan\nentity_type: location\ndescription: Ph\u1ea7n Lan, or Finland, was mentioned as a country that could be affected by the Soviet Union\u0027s actions or proposals.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "C\u00e1c Qu\u1ed1c Gia Baltic", "label": "C\u00e1c Qu\u1ed1c Gia Baltic", "shape": "dot", "size": 20, "title": "entity_id: C\u00e1c Qu\u1ed1c Gia Baltic\nentity_type: location\ndescription: C\u00e1c Qu\u1ed1c Gia Baltic, or the Baltic states, were a focus of discussion regarding potential Soviet intervention or German influence.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Th\u1ecfa Thu\u1eadn Qu\u00e2n S\u1ef1", "label": "Th\u1ecfa Thu\u1eadn Qu\u00e2n S\u1ef1", "shape": "dot", "size": 20, "title": "entity_id: Th\u1ecfa Thu\u1eadn Qu\u00e2n S\u1ef1\nentity_type: concept\ndescription: Th\u1ecfa Thu\u1eadn Qu\u00e2n S\u1ef1, or a military agreement, was proposed by the Soviet Union as a necessary component of any political agreement.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "European Security", "label": "European Security", "shape": "dot", "size": 20, "title": "entity_id: European Security\nentity_type: concept\ndescription: European Security refers to the political and military measures in place to ensure stability and safety on the European continent.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760061\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "German Aggression", "label": "German Aggression", "shape": "dot", "size": 20, "title": "entity_id: German Aggression\nentity_type: concept\ndescription: German Aggression refers to the potential or actual military actions taken by Germany that could threaten the security of other European countries.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760071\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Baltic States", "label": "Baltic States", "shape": "dot", "size": 20, "title": "entity_id: Baltic States\nentity_type: location\ndescription: The Baltic States are a group of countries located in Northern Europe, including Estonia, Latvia, and Lithuania, which were of concern in the discussions due to potential Soviet or German influence.\nsource_id: chunk-f2e0878e3deb8e67aadac2bcad2c3840\nfile_path: unknown_source\ncreated_at: 1762760071\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Th\u01b0 Vi\u1ec7n \u0110\u00f4ng Nam", "label": "Th\u01b0 Vi\u1ec7n \u0110\u00f4ng Nam", "shape": "dot", "size": 20, "title": "entity_id: Th\u01b0 Vi\u1ec7n \u0110\u00f4ng Nam\nentity_type: organization\ndescription: Th\u01b0 Vi\u1ec7n \u0110\u00f4ng Nam is a library that was initially a credit union for university and state employees.\nsource_id: chunk-68225f8af0db7090316f8464c418b2d8\nfile_path: unknown_source\ncreated_at: 1762760097\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "Ralph Rapson", "label": "Ralph Rapson", "shape": "dot", "size": 20, "title": "entity_id: Ralph Rapson\nentity_type: person\ndescription: Ralph Rapson is an architect who designed the building of Th\u01b0 Vi\u1ec7n \u0110\u00f4ng Nam.\u003cSEP\u003eRalph Rapson is the designer of the Riverside Plaza apartment complex.\nsource_id: chunk-68225f8af0db7090316f8464c418b2d8\u003cSEP\u003echunk-08d6f0bf2b314359366316f99f488378\nfile_path: unknown_source\ncreated_at: 1762760252\ntruncate: "}, {"color": "#97c2fc", "font": {"color": "white"}, "id": "T\u00f2a Nh\u00e0 C\u00f4ng \u0110o\u00e0n T\u00edn D\u1ee5ng Capitol Nh\u00e0 N\u01b0\u1edbc", "label": "T\u00f2a Nh\u00e0 C\u00f4ng \u0110o\u00e0n T\u00edn D\u1ee5ng Capitol Nh\u00e0 N\u01b0\u1edbc", "shape": "dot", "size": 20, "title": "entity_id: T\u00f2a Nh\u00e0 C\u00f4ng \u0110o\u00e0n T\u00edn D\u1ee5ng Capitol Nh\u00e0 N\u01b0\u1edbc\nentity_type: location\ndescription: T\u00f2a Nh\u00e0 C\u00f4ng \u0110o\u00e0n T\u00edn D\u1ee5ng Capitol Nh\u00e0 N\u01b0\u1edbc is a building located at 1222 \u0110\u01b0\u1eddng \u0110\u00f4ng Nam th\u1ee9 4 that was purchased to be converted into a library.\nsource_id: chunk-68225f8af0db7090316f8464c418b2d8\nfile_path: unknown_source\ncreated_at: 1762760097\ntruncate: "}, {"co
